<footer><a href="index.html" class="grammarBack" data-i="back"></a><p data-i="footer"></p></footer></main><div id="toast" role="status" hidden></div><dialog id="gResetDialog"><h2 data-i="reset"></h2><p data-i="resetQuestion"></p><div class="dialogActions"><button id="gCancel" class="secondary" data-i="cancel"></button><button id="gDelete" class="primary" data-i="delete"></button></div></dialog><script>window.GRAMMAR = [{"id": "g1", "level": "B1", "title": "Perfekt und Präteritum", "rule": "Im Perfekt stehen haben/sein und Partizip II. Bewegung und Zustandswechsel bilden das Perfekt oft mit sein. Im Präteritum ändern sich die Verbformen.", "questions": [{"id": "g1q1", "prompt": "Gestern ___ ich die Rechnung bezahlt.", "answer": "habe", "accepted": ["habe"], "options": ["habe", "bin", "werde"], "why": "Bezahlt ist das Partizip II von bezahlen; das Hilfsverb ist haben."}, {"id": "g1q2", "prompt": "Wir ___ letzte Woche nach Berlin gefahren.", "answer": "sind", "accepted": ["sind"], "options": ["sind", "haben", "werden"], "why": "Fahren mit Ortswechsel bildet das Perfekt mit sein."}, {"id": "g1q3", "prompt": "Als Kind ___ sie jeden Tag im Garten.", "answer": "spielte", "accepted": ["spielte"], "options": ["spielte", "gespielt", "spiele"], "why": "Spielte ist das Präteritum von spielen."}, {"id": "g1q4", "prompt": "Früher ___ er in einem kleinen Betrieb.", "answer": "arbeitete", "accepted": ["arbeitete"], "options": ["arbeitete", "gearbeitet", "arbeiten"], "why": "Bei arbeiten steht im Präteritum -ete."}, {"id": "g1q5", "prompt": "Sie ist gestern spät nach Hause ___. (kommen)", "answer": "gekommen", "accepted": ["gekommen"], "options": [], "why": "Das Partizip II von kommen ist gekommen; es steht hier mit sein."}]}, {"id": "g2", "level": "B1", "title": "Plusquamperfekt und Vorzeitigkeit", "rule": "Das Plusquamperfekt (hatte/war + Partizip II) bezeichnet ein Ereignis vor einem anderen vergangenen Ereignis.", "questions": [{"id": "g2q1", "prompt": "Nachdem ich den Vertrag ___, begann ich zu arbeiten.", "answer": "unterschrieben hatte", "accepted": ["unterschrieben hatte"], "options": ["unterschrieben hatte", "unterschrieben habe", "unterschreiben werde"], "why": "Die Unterschrift geschah vor dem Arbeitsbeginn: Plusquamperfekt im nachdem-Satz."}, {"id": "g2q2", "prompt": "Als wir ankamen, ___ der Zug schon abgefahren.", "answer": "war", "accepted": ["war"], "options": ["war", "hatte", "ist"], "why": "Abfahren bildet das Plusquamperfekt mit war."}, {"id": "g2q3", "prompt": "Sie konnte zahlen, weil sie vorher Geld ___ hatte.", "answer": "abgehoben", "accepted": ["abgehoben"], "options": ["abgehoben", "abheben", "abhob"], "why": "Hatte braucht das Partizip II abgehoben."}, {"id": "g2q4", "prompt": "Nachdem er gegessen hatte, ___ er ins Büro.", "answer": "ging", "accepted": ["ging"], "options": ["ging", "gegangen", "gehen"], "why": "Das spätere Ereignis steht hier im Präteritum: ging."}, {"id": "g2q5", "prompt": "Bevor ich anrief, hatte ich die E-Mail schon ___. (lesen)", "answer": "gelesen", "accepted": ["gelesen"], "options": [], "why": "Das Plusquamperfekt von lesen lautet hatte gelesen."}]}, {"id": "g3", "level": "B1", "title": "Modalverben und Ersatzformen", "rule": "Modalverben verbinden sich mit einem Infinitiv ohne zu. Müssen bezeichnet Notwendigkeit; dürfen Erlaubnis; sollen oft einen Auftrag.", "questions": [{"id": "g3q1", "prompt": "Sie ___ heute zum Arzt gehen; sie hat hohes Fieber.", "answer": "muss", "accepted": ["muss"], "options": ["muss", "darf", "mag"], "why": "Muss drückt hier die medizinische Notwendigkeit aus."}, {"id": "g3q2", "prompt": "Hier ist Rauchen verboten. Sie ___ hier nicht rauchen.", "answer": "dürfen", "accepted": ["dürfen"], "options": ["dürfen", "müssen", "sollen"], "why": "Nicht dürfen bedeutet Verbot; nicht müssen bedeutet keine Notwendigkeit."}, {"id": "g3q3", "prompt": "Du ___ den Bericht nicht heute abgeben; morgen reicht auch.", "answer": "musst", "accepted": ["musst"], "options": ["musst", "darfst", "kannst"], "why": "Nicht müssen: Es ist heute nicht notwendig."}, {"id": "g3q4", "prompt": "Der Chef sagt: Ich ___ die Kundin zurückrufen.", "answer": "soll", "accepted": ["soll"], "options": ["soll", "darf", "mag"], "why": "Sollen gibt hier den Auftrag einer anderen Person wieder."}, {"id": "g3q5", "prompt": "Ich bin in der Lage, die Maschine zu bedienen. Ich ___ die Maschine bedienen.", "answer": "kann", "accepted": ["kann"], "options": [], "why": "In der Lage sein entspricht hier können."}]}, {"id": "g4", "level": "B1", "title": "Satzbau und Verbposition", "rule": "Im Hauptsatz steht das finite Verb an Position 2; im Nebensatz mit weil/dass/wenn steht es am Ende. Nach einem vorangestellten Nebensatz folgt das Hauptsatzverb.", "questions": [{"id": "g4q1", "prompt": "Morgen ___ ich den Kunden an.", "answer": "rufe", "accepted": ["rufe"], "options": ["rufe", "ich rufe", "anrufe"], "why": "Morgen besetzt Position 1; rufe steht an Position 2."}, {"id": "g4q2", "prompt": "Ich bleibe zu Hause, weil ich krank ___.", "answer": "bin", "accepted": ["bin"], "options": ["bin", "sein", "bist"], "why": "Im weil-Satz steht das finite Verb am Ende."}, {"id": "g4q3", "prompt": "Wenn die Sitzung endet, ___ wir nach Hause.", "answer": "gehen", "accepted": ["gehen"], "options": ["gehen", "wir gehen", "zu gehen"], "why": "Der Nebensatz besetzt das Vorfeld; der Hauptsatz beginnt dann mit gehen."}, {"id": "g4q4", "prompt": "Ich weiß, dass er morgen ___ wird.", "answer": "kommen", "accepted": ["kommen"], "options": ["kommen", "kommt", "gekommen"], "why": "Im Futur-Nebensatz steht kommen vor dem finiten Hilfsverb wird."}, {"id": "g4q5", "prompt": "Ergänze das letzte Wort: Ich denke, dass die Kollegin heute ___. (arbeiten, Präsens)", "answer": "arbeitet", "accepted": ["arbeitet"], "options": [], "why": "Das finite Verb arbeitet steht am Ende des dass-Satzes."}]}, {"id": "g5", "level": "B1", "title": "Kausale und konzessive Verbindungen", "rule": "Weil/da nennen einen Grund; obwohl nennt einen Gegengrund. Deshalb und trotzdem sind Adverbien mit Verb an Position 2.", "questions": [{"id": "g5q1", "prompt": "Ich bin müde, ___ ich schlecht geschlafen habe.", "answer": "weil", "accepted": ["weil"], "options": ["weil", "obwohl", "damit"], "why": "Schlechter Schlaf ist hier der Grund für die Müdigkeit."}, {"id": "g5q2", "prompt": "___ es regnet, gehen wir spazieren.", "answer": "Obwohl", "accepted": ["Obwohl"], "options": ["Obwohl", "Weil", "Damit"], "why": "Regen ist ein Gegengrund zum Spaziergang: obwohl."}, {"id": "g5q3", "prompt": "Die Maschine ist defekt. Deshalb ___ wir sie nicht benutzen.", "answer": "können", "accepted": ["können"], "options": ["können", "wir können", "zu können"], "why": "Nach deshalb steht das finite Verb können vor dem Subjekt."}, {"id": "g5q4", "prompt": "Er ist krank. ___ kommt er zur Arbeit.", "answer": "Trotzdem", "accepted": ["Trotzdem"], "options": ["Trotzdem", "Deshalb", "Damit"], "why": "Trotzdem drückt den Gegensatz zur erwarteten Folge aus."}, {"id": "g5q5", "prompt": "Sie bleibt zu Hause, ___ sie krank ist. (Grund, Konjunktion)", "answer": "weil", "accepted": ["weil", "da"], "options": [], "why": "Weil und da leiten einen kausalen Nebensatz mit Verb am Ende ein."}]}, {"id": "g6", "level": "B1", "title": "Temporale Nebensätze", "rule": "Als steht bei einmaligen Ereignissen in der Vergangenheit; wenn bei Wiederholungen oder Bedingungen. Seitdem, während und bis beschreiben zeitliche Beziehungen.", "questions": [{"id": "g6q1", "prompt": "___ ich gestern ankam, war das Büro leer.", "answer": "Als", "accepted": ["Als"], "options": ["Als", "Wenn", "Seitdem"], "why": "Ein einmaliges Ereignis in der Vergangenheit verlangt als."}, {"id": "g6q2", "prompt": "Immer ___ ich Urlaub habe, fahre ich ans Meer.", "answer": "wenn", "accepted": ["wenn"], "options": ["wenn", "als", "nachdem"], "why": "Immer wenn bezeichnet wiederholte Ereignisse."}, {"id": "g6q3", "prompt": "___ sie telefoniert, schreibt er eine E-Mail.", "answer": "Während", "accepted": ["Während"], "options": ["Während", "Bevor", "Nachdem"], "why": "Während stellt hier zwei gleichzeitige Handlungen gegenüber."}, {"id": "g6q4", "prompt": "Warte bitte, ___ ich zurückkomme.", "answer": "bis", "accepted": ["bis"], "options": ["bis", "seitdem", "nachdem"], "why": "Bis nennt den Endpunkt des Wartens."}, {"id": "g6q5", "prompt": "___ ich hier wohne, fahre ich mit dem Rad zur Arbeit. (Beginn in der Vergangenheit, bis heute)", "answer": "Seitdem", "accepted": ["Seitdem", "Seit"], "options": [], "why": "Seitdem (auch: seit) verbindet einen vergangenen Beginn mit einer bis heute geltenden Situation."}]}, {"id": "g7", "level": "B1", "title": "Finalsätze: damit und um … zu", "rule": "Um … zu ist bei gleichem handelnden Subjekt möglich. Damit kann unterschiedliche Subjekte verbinden.", "questions": [{"id": "g7q1", "prompt": "Ich lerne Deutsch, ___ bessere Berufschancen zu haben.", "answer": "um", "accepted": ["um"], "options": ["um", "damit", "ohne"], "why": "Beide Handlungen haben dasselbe Subjekt ich: um … zu."}, {"id": "g7q2", "prompt": "Ich erkläre es langsam, ___ alle mich verstehen.", "answer": "damit", "accepted": ["damit"], "options": ["damit", "um", "weil"], "why": "Ich und alle sind verschiedene Subjekte; damit braucht einen finiten Nebensatz."}, {"id": "g7q3", "prompt": "Sie spart Geld, um ein Auto ___ kaufen.", "answer": "zu", "accepted": ["zu"], "options": ["zu", "für", "damit"], "why": "Der finale Infinitiv lautet um … zu kaufen."}, {"id": "g7q4", "prompt": "Wir schreiben die Regeln auf, damit niemand sie ___.", "answer": "vergisst", "accepted": ["vergisst"], "options": ["vergisst", "vergessen", "zu vergessen"], "why": "Nach damit steht das finite Verb vergisst am Satzende."}, {"id": "g7q5", "prompt": "Ergänze: Ich gehe früh los, ___ pünktlich anzukommen.", "answer": "um", "accepted": ["um"], "options": [], "why": "Bei identischem Subjekt steht um … zu; anzukommen hat zu zwischen Präfix und Stamm."}]}, {"id": "g8", "level": "B1", "title": "Infinitiv mit zu", "rule": "Nach vielen Verben und Ausdrücken steht zu + Infinitiv. Bei trennbaren Verben steht zu zwischen Präfix und Stamm. Nach Modalverben steht kein zu.", "questions": [{"id": "g8q1", "prompt": "Ich habe vor, morgen früher ___.", "answer": "anzufangen", "accepted": ["anzufangen"], "options": ["anzufangen", "zu anfangen", "anfangen zu"], "why": "Anfangen ist trennbar: anzufangen."}, {"id": "g8q2", "prompt": "Es ist wichtig, den Vertrag genau ___.", "answer": "zu lesen", "accepted": ["zu lesen"], "options": ["zu lesen", "lesen", "liest"], "why": "Nach es ist wichtig folgt hier ein Infinitiv mit zu."}, {"id": "g8q3", "prompt": "Sie versucht, den Fehler ___.", "answer": "zu korrigieren", "accepted": ["zu korrigieren"], "options": ["zu korrigieren", "zukorrigieren", "korrigiert"], "why": "Bei nicht trennbaren Verben steht zu als eigenes Wort vor dem Infinitiv."}, {"id": "g8q4", "prompt": "Ich kann morgen früher ___.", "answer": "kommen", "accepted": ["kommen"], "options": ["kommen", "zu kommen", "kommt"], "why": "Nach können steht der Infinitiv ohne zu."}, {"id": "g8q5", "prompt": "Er hat vergessen, das Formular ___. (ausfüllen)", "answer": "auszufüllen", "accepted": ["auszufüllen"], "options": [], "why": "Ausfüllen ist trennbar: aus + zu + füllen."}]}, {"id": "g9", "level": "B1", "title": "Relativsätze", "rule": "Das Genus und der Numerus des Relativpronomens richten sich nach dem Bezugswort; der Kasus nach seiner Funktion im Relativsatz.", "questions": [{"id": "g9q1", "prompt": "Die Frau, ___ hier arbeitet, ist Ingenieurin.", "answer": "die", "accepted": ["die"], "options": ["die", "der", "den"], "why": "Frau ist feminin; das Relativpronomen ist Subjekt: die."}, {"id": "g9q2", "prompt": "Der Mann, ___ ich angerufen habe, ist mein Chef.", "answer": "den", "accepted": ["den"], "options": ["den", "der", "dem"], "why": "Anrufen verlangt Akkusativ: den."}, {"id": "g9q3", "prompt": "Die Kollegin, ___ ich helfe, ist neu.", "answer": "der", "accepted": ["der"], "options": ["der", "die", "den"], "why": "Helfen verlangt Dativ; feminin Dativ lautet der."}, {"id": "g9q4", "prompt": "Das ist der Kunde, mit ___ ich gesprochen habe.", "answer": "dem", "accepted": ["dem"], "options": ["dem", "den", "der"], "why": "Mit verlangt Dativ; Kunde ist maskulin: dem."}, {"id": "g9q5", "prompt": "Das sind die Leute, mit ___ wir arbeiten.", "answer": "denen", "accepted": ["denen"], "options": [], "why": "Mit verlangt Dativ; im Plural lautet das Relativpronomen denen."}]}, {"id": "g10", "level": "B1", "title": "Adjektivdeklination", "rule": "Adjektivendungen hängen von Artikel, Genus, Numerus und Kasus ab. Nach einem bestimmten Artikel haben sie meist -e oder -en.", "questions": [{"id": "g10q1", "prompt": "Ich suche einen ___ Arbeitsplatz.", "answer": "sicheren", "accepted": ["sicheren"], "options": ["sicheren", "sicherer", "sichere"], "why": "Maskulin Akkusativ nach einen: sicheren."}, {"id": "g10q2", "prompt": "Die ___ Kollegin erklärt alles.", "answer": "neue", "accepted": ["neue"], "options": ["neue", "neuen", "neuer"], "why": "Feminin Nominativ nach die: neue."}, {"id": "g10q3", "prompt": "Wir arbeiten mit einem ___ Computer.", "answer": "neuen", "accepted": ["neuen"], "options": ["neuen", "neuer", "neues"], "why": "Mit verlangt Dativ; nach einem steht neuen."}, {"id": "g10q4", "prompt": "___ Kaffee hilft mir am Morgen.", "answer": "Starker", "accepted": ["Starker"], "options": ["Starker", "Starken", "Starke"], "why": "Ohne Artikel trägt das Adjektiv maskulin Nominativ die Endung -er."}, {"id": "g10q5", "prompt": "Sie trägt ein ___ Hemd. (weiß)", "answer": "weißes", "accepted": ["weißes"], "options": [], "why": "Neutrum Akkusativ nach ein: weißes."}]}, {"id": "g11", "level": "B1", "title": "Kasus und Präpositionen", "rule": "Mit, bei, nach, seit und von verlangen Dativ. Für, ohne, durch und gegen verlangen Akkusativ.", "questions": [{"id": "g11q1", "prompt": "Ich fahre mit ___ Bus.", "answer": "dem", "accepted": ["dem"], "options": ["dem", "den", "der"], "why": "Mit verlangt Dativ; der Bus → dem Bus."}, {"id": "g11q2", "prompt": "Das Geschenk ist für ___ Kollegin.", "answer": "die", "accepted": ["die"], "options": ["die", "der", "den"], "why": "Für verlangt Akkusativ; die Kollegin bleibt die Kollegin."}, {"id": "g11q3", "prompt": "Seit ___ Monat arbeitet er hier.", "answer": "einem", "accepted": ["einem"], "options": ["einem", "einen", "ein"], "why": "Seit verlangt Dativ: seit einem Monat."}, {"id": "g11q4", "prompt": "Ohne ___ Ausweis kann ich nicht reisen.", "answer": "meinen", "accepted": ["meinen"], "options": ["meinen", "meinem", "meiner"], "why": "Ohne verlangt Akkusativ; Ausweis ist maskulin."}, {"id": "g11q5", "prompt": "Sie kommt aus ___ Türkei.", "answer": "der", "accepted": ["der"], "options": [], "why": "Aus verlangt Dativ; die Türkei → der Türkei."}]}, {"id": "g12", "level": "B1", "title": "Wechselpräpositionen", "rule": "Bei Wechselpräpositionen steht Dativ für einen Ort (wo?) und Akkusativ für ein räumliches Ziel (wohin?). Bewegung allein bedeutet nicht automatisch Akkusativ.", "questions": [{"id": "g12q1", "prompt": "Das Buch liegt auf ___ Tisch.", "answer": "dem", "accepted": ["dem"], "options": ["dem", "den", "der"], "why": "Wo liegt es? Ort: Dativ, auf dem Tisch."}, {"id": "g12q2", "prompt": "Ich lege das Buch auf ___ Tisch.", "answer": "den", "accepted": ["den"], "options": ["den", "dem", "der"], "why": "Wohin lege ich es? Ziel: Akkusativ, auf den Tisch."}, {"id": "g12q3", "prompt": "Die Kinder spielen in ___ Garten.", "answer": "dem", "accepted": ["dem"], "options": ["dem", "den", "die"], "why": "Das Spielen findet im Garten statt: Dativ, auch bei Bewegung innerhalb des Ortes."}, {"id": "g12q4", "prompt": "Wir hängen das Bild an ___ Wand.", "answer": "die", "accepted": ["die"], "options": ["die", "der", "den"], "why": "Wohin hängen wir das Bild? Akkusativ, an die Wand."}, {"id": "g12q5", "prompt": "Der Schlüssel liegt in ___ Tasche. (die Tasche)", "answer": "der", "accepted": ["der"], "options": [], "why": "Wo liegt der Schlüssel? Feminin Dativ: in der Tasche."}]}, {"id": "g13", "level": "B1", "title": "Verben mit Präpositionen und Pronominaladverbien", "rule": "Viele Verben haben eine feste Präposition. Bei Sachen stehen oft da(r)-/wo(r)-Formen; bei Personen Präposition + Pronomen.", "questions": [{"id": "g13q1", "prompt": "Ich warte ___ den Bus.", "answer": "auf", "accepted": ["auf"], "options": ["auf", "für", "an"], "why": "Die feste Verbindung ist warten auf + Akkusativ."}, {"id": "g13q2", "prompt": "Sie interessiert sich ___ Technik.", "answer": "für", "accepted": ["für"], "options": ["für", "auf", "mit"], "why": "Sich interessieren für verlangt Akkusativ."}, {"id": "g13q3", "prompt": "Ich freue mich ___ den Urlaub nächste Woche.", "answer": "auf", "accepted": ["auf"], "options": ["auf", "über", "an"], "why": "Sich freuen auf bezieht sich auf ein erwartetes zukünftiges Ereignis."}, {"id": "g13q4", "prompt": "Ich denke oft an meinen Bruder. ___ denkst du?", "answer": "An wen", "accepted": ["An wen"], "options": ["An wen", "Woran", "Wofür"], "why": "Bei einer Person fragt man an wen, nicht woran."}, {"id": "g13q5", "prompt": "Du wartest auf das Ergebnis. Ich warte auch ___.", "answer": "darauf", "accepted": ["darauf"], "options": [], "why": "Bei einer Sache ersetzt darauf die Verbindung auf das Ergebnis."}]}, {"id": "g14", "level": "B1", "title": "Reflexive Verben und Pronomen", "rule": "Reflexivpronomen beziehen sich auf das Subjekt. Mit einem weiteren Akkusativobjekt steht das Reflexivpronomen oft im Dativ.", "questions": [{"id": "g14q1", "prompt": "Ich interessiere ___ für IT.", "answer": "mich", "accepted": ["mich"], "options": ["mich", "mir", "sich"], "why": "Sich interessieren braucht hier das Reflexivpronomen im Akkusativ: mich."}, {"id": "g14q2", "prompt": "Sie bewirbt ___ um eine Stelle.", "answer": "sich", "accepted": ["sich"], "options": ["sich", "sie", "ihr"], "why": "In der dritten Person lautet das Reflexivpronomen sich."}, {"id": "g14q3", "prompt": "Ich wasche ___ die Hände.", "answer": "mir", "accepted": ["mir"], "options": ["mir", "mich", "mein"], "why": "Die Hände ist Akkusativobjekt; die Person steht im Dativ: mir."}, {"id": "g14q4", "prompt": "Wir freuen ___ auf das Wochenende.", "answer": "uns", "accepted": ["uns"], "options": ["uns", "sich", "euch"], "why": "Das Reflexivpronomen zu wir ist uns."}, {"id": "g14q5", "prompt": "Du solltest ___ mehr Zeit nehmen.", "answer": "dir", "accepted": ["dir"], "options": [], "why": "Sich Zeit nehmen: Zeit ist Akkusativ; die Person steht im Dativ, zu du also dir."}]}, {"id": "g15", "level": "B1", "title": "Konjunktiv II: Wünsche und höfliche Bitten", "rule": "Konjunktiv II drückt Wünsche, Irreales oder Höflichkeit aus. Häufige Formen: hätte, wäre, könnte, würde + Infinitiv.", "questions": [{"id": "g15q1", "prompt": "___ Sie mir bitte helfen?", "answer": "Könnten", "accepted": ["Könnten"], "options": ["Könnten", "Konnten", "Können zu"], "why": "Könnten ist eine höfliche Bitte im Konjunktiv II."}, {"id": "g15q2", "prompt": "Wenn ich mehr Zeit hätte, ___ ich mehr lernen.", "answer": "würde", "accepted": ["würde"], "options": ["würde", "werde", "wurde"], "why": "Die irreale Folge wird hier mit würde + Infinitiv ausgedrückt."}, {"id": "g15q3", "prompt": "Ich ___ gern einen ruhigeren Arbeitsplatz.", "answer": "hätte", "accepted": ["hätte"], "options": ["hätte", "hatte", "habe zu"], "why": "Hätte gern drückt einen Wunsch aus."}, {"id": "g15q4", "prompt": "An deiner Stelle ___ ich mit dem Chef sprechen.", "answer": "würde", "accepted": ["würde"], "options": ["würde", "wurde", "werde"], "why": "An deiner Stelle + würde ist ein typischer Ratschlag."}, {"id": "g15q5", "prompt": "Wenn ich reich ___, würde ich weniger arbeiten. (sein)", "answer": "wäre", "accepted": ["wäre"], "options": [], "why": "Die Konjunktiv-II-Form von sein lautet wäre."}]}, {"id": "g16", "level": "B1", "title": "Komparation und Vergleiche", "rule": "Komparativ + als beschreibt Unterschiede; so/genauso + Positiv + wie Gleichheit. Manche Formen sind unregelmäßig: gut → besser → am besten.", "questions": [{"id": "g16q1", "prompt": "Dieser Tarif ist günstiger ___ der alte.", "answer": "als", "accepted": ["als"], "options": ["als", "wie", "so"], "why": "Nach einem Komparativ steht als."}, {"id": "g16q2", "prompt": "Das neue Gerät ist genauso schnell ___ das alte.", "answer": "wie", "accepted": ["wie"], "options": ["wie", "als", "denn"], "why": "Gleichheit: genauso … wie."}, {"id": "g16q3", "prompt": "Von allen Angeboten ist dieses am ___.", "answer": "besten", "accepted": ["besten"], "options": ["besten", "besser", "gut"], "why": "Der Superlativ von gut lautet am besten."}, {"id": "g16q4", "prompt": "Je mehr ich übe, ___ sicherer werde ich.", "answer": "desto", "accepted": ["desto"], "options": ["desto", "als", "wie"], "why": "Die feste zweiteilige Verbindung lautet je … desto."}, {"id": "g16q5", "prompt": "Mein Weg ist jetzt ___ als früher. (kurz, Komparativ)", "answer": "kürzer", "accepted": ["kürzer"], "options": [], "why": "Kurz hat im Komparativ einen Umlaut: kürzer."}]}, {"id": "g17", "level": "B2", "title": "Vorgangspassiv und Zustandspassiv", "rule": "Werden + Partizip II beschreibt einen Vorgang; sein + Partizip II einen Zustand als Ergebnis. Perfekt des Vorgangspassivs: ist … worden.", "questions": [{"id": "g17q1", "prompt": "Die Rechnung ___ gerade geprüft.", "answer": "wird", "accepted": ["wird"], "options": ["wird", "ist", "hat"], "why": "Gerade geprüft werden bezeichnet hier den laufenden Vorgang."}, {"id": "g17q2", "prompt": "Die Tür ist nicht mehr offen. Sie ___ geschlossen.", "answer": "ist", "accepted": ["ist"], "options": ["ist", "hat", "wird zu"], "why": "Ist geschlossen beschreibt den Zustand der Tür."}, {"id": "g17q3", "prompt": "Der Vertrag ist gestern unterschrieben ___.", "answer": "worden", "accepted": ["worden"], "options": ["worden", "geworden", "werden"], "why": "Im Perfekt des Vorgangspassivs steht , "questions": [{"id": "g19q1", "prompt": "Wenn ich früher losgefahren wäre, ___ ich den Zug erreicht.", "answer": "hätte", "accepted": ["hätte"], "options": ["hätte", "wäre", "würde"], "why": "Erreichen bildet die irreale Vergangenheit mit hätte + Partizip II."}, {"id": "g19q2", "prompt": "Wenn sie gelernt hätte, ___ sie die Prüfung bestanden.", "answer": "hätte", "accepted": ["hätte"], "options": ["hätte", "wäre", "würde"], "why": "Bestanden haben → hätte bestanden."}, {"id": "g19q3", "prompt": "Ich hätte dich gestern anrufen ___.", "answer": "sollen", "accepted": ["sollen"], "options": ["sollen", "gesollt", "sollte"], "why": "Mit einem weiteren Infinitiv benutzt man den Ersatzinfinitiv sollen."}, {"id": "g19q4", "prompt": "Ohne den Stau ___ wir pünktlich angekommen.", "answer": "wären", "accepted": ["wären"], "options": ["wären", "hätten", "würden"], "why": "Ankommen bildet die irreale Vergangenheit mit wären angekommen."}, {"id": "g19q5", "prompt": "Wenn ich das gewusst hätte, ___ ich zu Hause geblieben. (sein)", "answer": "wäre", "accepted": ["wäre"], "options": [], "why": "Bleiben wird mit sein gebildet: wäre geblieben."}]}, {"id": "g20", "level": "B2", "title": "Indirekte Rede: Konjunktiv I", "rule": "In formeller indirekter Rede steht häufig Konjunktiv I: er sei, er habe, er komme. Bei Formgleichheit mit dem Indikativ ist Konjunktiv II als Ersatz üblich.", "questions": [{"id": "g20q1", "prompt": "Die Chefin sagt, sie ___ heute im Homeoffice.", "answer": "sei", "accepted": ["sei"], "options": ["sei", "seien", "seiest"], "why": "Konjunktiv I von sein in der dritten Person Singular: sei."}, {"id": "g20q2", "prompt": "Er erklärt, er ___ bereits bezahlt.", "answer": "habe", "accepted": ["habe"], "options": ["habe", "habest", "haben"], "why": "Indirekte Rede im Perfekt: er habe bezahlt."}, {"id": "g20q3", "prompt": "Die Sprecherin sagt, die Firma ___ neue Mitarbeiter.", "answer": "suche", "accepted": ["suche"], "options": ["suche", "suchest", "suchen"], "why": "Di , "level": "B2", "title": "Partizipien als Adjektive", "rule": "Partizip I (Infinitiv + d) beschreibt meist eine aktive, laufende Handlung; Partizip II häufig ein Ergebnis oder eine passive Bedeutung. Beide werden als Adjektive dekliniert.", "questions": [{"id": "g22q1", "prompt": "Die gerade ___ Maschine ist laut. (laufen)", "answer": "laufende", "accepted": ["laufende"], "options": ["laufende", "gelaufene", "laufen"], "why": "Die Maschine läuft gerade: aktive laufende Handlung, Partizip I laufend + Endung -e."}, {"id": "g22q2", "prompt": "Bitte unterschreiben Sie den bereits ___ Vertrag.", "answer": "geprüften", "accepted": ["geprüften"], "options": ["geprüften", "prüfenden", "prüfend"], "why": "Der Vertrag wurde geprüft: Partizip II geprüft + Akkusativendung -en."}, {"id": "g22q3", "prompt": "Die im Ausland ___ Bewerberin spricht drei Sprachen. (leben)", "answer": "lebende", "accepted": ["lebende"], "options": ["lebende", "gelebte", "leben"], "why": "Die Bewerberin lebt im Ausland: lebend + -e."}, {"id": "g22q4", "prompt": "Wir besprechen die gestern ___ Entscheidung. (treffen)", "answer": "getroffene", "accepted": ["getroffene"], "options": ["getroffene", "treffende", "treffen"], "why": "Die Entscheidung wurde gestern getroffen: getroffene."}, {"id": "g22q5", "prompt": "Die ___ Kunden warten im Flur. (ankommen, Partizip II)", "answer": "angekommenen", "accepted": ["angekommenen"], "options": [], "why": "Angekommen beschreibt hier ein abgeschlossenes Ereignis; nach die im Plural steht -en."}]}, {"id": "g23", "level": "B2", "title": "Nominalisierung und Funktionsverbgefüge", "rule": "Nominalisierung macht aus Verben Nomen. Funktionsverbgefüge verbinden ein Nomen mit einem relativ bedeutungsarmen Verb: eine Entscheidung treffen, zur Verfügung stehen.", "questions": [{"id": "g23q1", "prompt": "Wir müssen heute eine Entscheidung ___.", "answer": "treffen", "accepted": ["treffen"], "options": ["treffen", "machen", "tun"], "why": "Die feste Verbindung lautet eine Entsc const byId=new Map();GRAMMAR.forEach(topic=>topic.questions.forEach(q=>byId.set(q.id,{...q,topic})));
const GKEY='wortgarten.grammar.v1',g$=id=>document.getElementById(id);
let gLang='en',records={},gStorage=true,currentSession=null,gTimer;
function gt(k){return GT[k][GL.indexOf(gLang)];}
function gRead(raw){const data=JSON.parse(raw);if(!data||data.version!==1||data.app!=='WortgartenGrammar'||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('invalid');const result={};for(const [id,r]of Object.entries(data.records)){if(!byId.has(id)||!r||!Number.isInteger(r.attempts)||r.attempts<1||!Number.isInteger(r.correct)||r.correct<0||r.correct>r.attempts||typeof r.lastCorrect!=='boolean'||!Number.isFinite(r.updated)||r.updated<0)throw Error('invalid');result[id]={attempts:r.attempts,correct:r.correct,lastCorrect:r.lastCorrect,updated:r.updated};}return {records:result,lang:GL.includes(data.lang)?data.lang:'en'};}
try{const raw=localStorage.getItem(GKEY);if(raw){const data=gRead(raw);records=data.records;gLang=data.lang;}else{const main=JSON.parse(localStorage.getItem('wortgarten.v1')||'null');if(main&&GL.includes(main.lang))gLang=main.lang;}}catch{gStorage=false;}
const requestedLanguage=window.WORTGARTEN_INITIAL_LANGUAGE||new URLSearchParams(window.location?.search||'').get('lang');if(GL.includes(requestedLanguage))gLang=requestedLanguage;
function gPayload(){return {app:'WortgartenGrammar',version:1,lang:gLang,records,exportedAt:new Date().toISOString()};}
function gSave(){try{localStorage.setItem(GKEY,JSON.stringify(gPayload()));gStorage=true;}catch{gStorage=false;}g$('gSaveStatus').textContent=gt(gStorage?'saved':'blocked');}
function gToast(key){clearTimeout(gTimer);g$('toast').textContent=gt(key);g$('toast').hidden=false;gTimer=setTimeout(()=>g$('toast').hidden=true,4000);}
function ge(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function gStats(){const rs=Object.values(records),attempts=rs.reduce((n,r)=>n+r.attempts,0),correct=rs.reduce((n,r)=>n+r.correct,0);g$('gTotal').textContent=byId.size;g$('gAttempted').textContent=rs.length;g$('gCorrect').textContent=rs.filter(r=>r.lastCorrect).length;g$('gAccuracy').textContent=(attempts?Math.round(correct/attempts*100):0)+'%';}
function gTopics(){const list=g$('topicList');list.replaceChildren();for(const topic of GRAMMAR){if(g$('gLevel').value!=='all'&&g$('gLevel').value!==topic.level)continue;const correct=topic.questions.filter(q=>records[q.id]?.lastCorrect).length,b=ge('button','topicButton');b.append(ge('span','pill',topic.level));const name=ge('span','topicName',topic.title);name.lang='de';name.dir='ltr';b.append(name,ge('span','small',correct+' / '+topic.questions.length+' · '+gt('correctLast')));const bar=ge('progress');bar.max=topic.questions.length;bar.value=correct;bar.setAttribute('aria-label',topic.title);b.append(bar);b.onclick=()=>startSession(topic.questions.map(q=>q.id),topic.title);list.append(b);}}
function availableQuestions(){return [...byId.values()].filter(q=>g$('gLevel').value==='all'||q.topic.level===g$('gLevel').value);}
function startSession(ids,title){currentSession={ids:[...ids],index:0,score:0,title,checked:false,selected:'',typed:'',options:[]};g$('sessionEnd').hidden=true;g$('exercise').hidden=false;gNextCard();g$('exercise').scrollIntoView({behavior:'smooth',block:'start'});}
function gNextCard(){const s=currentSession;if(!s)return;if(s.index>=s.ids.length){g$('exercise').hidden=true;g$('sessionEnd').hidden=false;g$('endScore').textContent=s.score+' / '+s.ids.length;g$('sessionEnd').scrollIntoView({block:'start'});return;}s.checked=false;s.selected='';s.typed='';s.options=shuffle(byId.get(s.ids[s.index]).options);g$('ruleBox').open=false;renderExercise();g$('gPrompt').focus({preventScroll:true});}
function renderExercise(){const s=currentSession;if(!s||s.index>=s.ids.length)return;const q=byId.get(s.ids[s.index]);g$('exerciseTitle').textContent=q.topic.title;g$('exerciseLevel').textContent=q.topic.level;g$('exerciseCount').textContent=(s.index+1)+' / '+s.ids.length;g$('sessionScore').textContent=s.score+' / '+s.ids.length;g$('gRule').textContent=q.topic.rule;g$('gPrompt').textContent=q.prompt;g$('questionHint').textContent=gt(q.options.length?'choose':'type');g$('answers').replaceChildren();g$('answers').setAttribute('aria-label',gt('choose'));
 for(const [i,option]of s.options.entries()){const label=ge('label','answerOption'),input=ge('input');input.type='radio';input.name='grammarAnswer';input.value=option;input.checked=s.selected===option;input.disabled=s.checked;input.onchange=()=>s.selected=option;const text=ge('span','',option);text.lang='de';label.append(input,text);g$('answers').append(label);}
 g$('inputLabel').hidden=!!q.options.length;g$('typedAnswer').value=s.typed;g$('typedAnswer').disabled=s.checked;g$('checkAnswer').hidden=s.checked;g$('nextQuestion').hidden=!s.checked;g$('feedback').hidden=!s.checked;if(s.checked)renderFeedback(q,s.wasCorrect);
}
function gNormalize(s){return s.normalize('NFC').trim().toLocaleLowerCase('de').replace(/ß/g,'ss').replace(/[.!?]+$/,'').replace(/\s+/g,' ');}
function submitAnswer(){const s=currentSession;if(!s||s.checked)return;const q=byId.get(s.ids[s.index]);s.typed=g$('typedAnswer').value;const answer=q.options.length?s.selected:s.typed;if(!answer.trim()){gToast('needAnswer');return;}s.wasCorrect=q.accepted.some(value=>gNormalize(answer)===gNormalize(value));s.checked=true;if(s.wasCorrect)s.score++;const old=records[q.id]||{attempts:0,correct:0};records[q.id]={attempts:old.attempts+1,correct:old.correct+(s.wasCorrect?1:0),lastCorrect:s.wasCorrect,updated:Date.now()};gSave();gStats();gTopics();renderExercise();g$('nextQuestion').focus({preventScroll:true});}
function renderFeedback(q,correct){const box=g$('feedback');box.className=correct?'correct':'incorrect';box.replaceChildren(ge('strong','',gt(correct?'right':'wrong')),ge('p','',gt('solution')));const answer=ge('p','answerText',q.answer);answer.lang='de';answer.dir='ltr';const why=ge('p','',q.why);why.lang='de';why.dir='ltr';box.append(answer,why);}
function gTranslate(){document.documentElement.lang=gLang;document.documentElement.dir=['ar','fa'].includes(gLang)?'rtl':'ltr';g$('gLanguage').value=gLang;document.querySelectorAll('[data-i]').forEach(n=>n.textContent=gt(n.dataset.i));g$('gSaveStatus').textContent=gt(gStorage?'saved':'blocked');gStats();gTopics();renderExercise();}
g$('gLanguage').onchange=e=>{gLang=e.target.value;gSave();gTranslate();};g$('gLevel').onchange=gTopics;
g$('mixed').onclick=()=>startSession(shuffle(availableQuestions()).slice(0,10).map(q=>q.id),'mixed');
g$('errors').onclick=()=>{const ids=availableQuestions().filter(q=>records[q.id]&&!records[q.id].lastCorrect).map(q=>q.id);if(!ids.length){gToast('noErrors');return;}startSession(shuffle(ids),'errors');};
g$('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer();};g$('typedAnswer').oninput=e=>{if(currentSession)currentSession.typed=e.target.value;};g$('nextQuestion').onclick=()=>{if(currentSession?.checked){currentSession.index++;gNextCard();}};g$('repeatSession').onclick=()=>{if(currentSession)startSession(currentSession.ids,currentSession.title);};
g$('gExport').onclick=()=>{const blob=new Blob([JSON.stringify(gPayload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=ge('a');a.href=url;a.download='wortgarten-grammar-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
g$('gImport').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error('large');const data=gRead(await f.text()),merged={...records};for(const [id,r]of Object.entries(data.records))if(!merged[id]||r.updated>=merged[id].updated)merged[id]=r;records=merged;gSave();gTranslate();gToast('imported');}catch{gToast('invalid');}finally{e.target.value='';}};
g$('gReset').onclick=()=>g$('gResetDialog').showModal();g$('gCancel').onclick=()=>g$('gResetDialog').close();g$('gDelete').onclick=()=>{records={};currentSession=null;gSave();g$('gResetDialog').close();g$('exercise').hidden=true;g$('sessionEnd').hidden=true;gTranslate();};
window.addEventListener('storage',e=>{if(e.key!==GKEY)return;try{const incoming=e.newValue?gRead(e.newValue):{records,lang:gLang};if(!e.newValue)incoming.records={};records=incoming.records;gLang=incoming.lang;gTranslate();}catch{/* Invalid external updates do not replace local results. */}});
gTranslate();
</script></body></html>
