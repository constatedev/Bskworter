<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>Wortgarten · Grammatik Übungen</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="grammar.css"><script src="grammar-data.js" defer></script><script src="grammar-app.js" defer></script></head><body>
<header><div class="wrap top"><a class="brand" href="index.html">Wortgarten <span aria-hidden="true">✳</span></a><label class="language"><span data-i="language">Language</span><select id="gLanguage"><option value="en">English</option><option value="uk">Українська</option><option value="tr">Türkçe</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="fa">فارسی</option></select></label></div></header>
<main class="wrap grammarMain"><p class="eyebrow">DEUTSCH · B1–B2</p><h1>Grammatik Übungen</h1><p class="intro" data-i="intro"></p>
<section class="stats"><div><strong id="gTotal">120</strong><span data-i="exercises"></span></div><div><strong id="gAttempted">0</strong><span data-i="attempted"></span></div><div><strong id="gCorrect">0</strong><span data-i="correctLast"></span></div><div><strong id="gAccuracy">0%</strong><span data-i="accuracy"></span></div></section>
<section class="section"><div class="sectionTitle"><h2 data-i="topics"></h2><label><span class="sr-only" data-i="level"></span><select id="gLevel"><option value="all">B1 + B2</option><option>B1</option><option>B2</option></select></label></div><div class="grammarActions"><button class="primary" id="mixed" data-i="mixed"></button><button class="secondary" id="errors" data-i="errors"></button></div><p class="hint" data-i="scope"></p><div id="topicList" class="topicGrid"></div></section>
<section id="exercise" class="section" hidden><div class="sectionTitle"><h2 id="exerciseTitle" lang="de" dir="ltr"></h2><span id="exerciseCount" class="small"></span></div><div class="exerciseBox"><div class="cardTop"><span id="exerciseLevel" class="pill"></span><span id="sessionScore" class="small"></span></div><details id="ruleBox"><summary data-i="rule"></summary><p id="gRule" lang="de" dir="ltr"></p></details><p id="questionHint" class="small"></p><h3 id="gPrompt" lang="de" dir="ltr" tabindex="-1"></h3><form id="answerForm"><div id="answers" class="answerOptions" role="group"></div><label id="inputLabel"><span data-i="answer"></span><input id="typedAnswer" type="text" lang="de" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button class="primary" type="submit" id="checkAnswer" data-i="check"></button></form><div id="feedback" role="status" hidden></div><button id="nextQuestion" class="primary" data-i="next" hidden></button></div></section>
<section class="section" id="sessionEnd" hidden><div class="exerciseBox"><h2 data-i="finished"></h2><p id="endScore"></p><p class="hint" data-i="scoreHint"></p><button id="repeatSession" class="secondary" data-i="repeat"></button></div></section>
<section class="section settings"><div><h2 data-i="backup"></h2><p class="hint" data-i="saveHint"></p><p id="gSaveStatus" role="status" class="small"></p></div><div class="backupActions"><button id="gExport" class="secondary" data-i="export"></button><label class="secondary importLabel"><span data-i="import"></span><input type="file" id="gImport" accept=".json,application/json" class="sr-only"></label><button id="gReset" class="textButton danger" data-i="reset"></button></div></section>
<footer><a href="index.html" class="grammarBack" data-i="back"></a><p data-i="footer"></p></footer></main><div id="toast" role="status" hidden></div><dialog id="gResetDialog"><h2 data-i="reset"></h2><p data-i="resetQuestion"></p><div class="dialogActions"><button id="gCancel" class="secondary" data-i="cancel"></button><button id="gDelete" class="primary" data-i="delete"></button></div></dialog></body></html>
